{% extends 'diary/base.html' %}

{% block title %}{% if object %}Редактировать запись{% else %}Новая запись{% endif %}{% endblock %}

{% block content %}
    <h1>{% if object %}Редактировать запись{% else %}Новая запись{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="{{ form.title.id_for_label }}" class="form-label">{{ form.title.label }}</label>
            <input type="text" name="{{ form.title.name }}" id="{{ form.title.id_for_label }}" class="form-control" value="{{ form.title.value|default_if_none:'' }}">
        </div>

        <div class="mb-3">
            <label for="{{ form.content.id_for_label }}" class="form-label">{{ form.content.label }}</label>
            <textarea name="{{ form.content.name }}" id="{{ form.content.id_for_label }}" class="form-control" rows="10">{{ form.content.value|default_if_none:'' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% if object %}{% url 'diary:entry_detail' object.pk %}{% else %}{% url 'diary:entry_list' %}{% endif %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
