{% extends 'diary/base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
    <div class="alert alert-danger" role="alert">
        <h4 class="alert-heading">Подтверждение удаления</h4>
        <p>Вы уверены, что хотите удалить запись "<strong>{{ object.title }}</strong>"?</p>
        <hr>
        <p class="mb-0">Это действие необратимо.</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, я уверен. Удалить.</button>
        <a href="{% url 'diary:entry_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
